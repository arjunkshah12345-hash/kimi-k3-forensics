  </div>
  <script>
    (function () {
      // Measured share of "spelling" experts in each of the 92 MoE layers (results/v2).
      const SHARES = [0.009,0.003,0.006,0.004,0.003,0.0,0.004,0.009,0.007,0.004,0.007,0.013,0.011,0.016,0.016,0.03,0.033,0.017,0.029,0.035,0.023,0.027,0.02,0.012,0.011,0.006,0.013,0.01,0.021,0.021,0.006,0.01,0.008,0.009,0.016,0.008,0.01,0.007,0.003,0.013,0.016,0.016,0.018,0.019,0.018,0.016,0.022,0.065,0.093,0.019,0.017,0.112,0.136,0.128,0.039,0.186,0.22,0.172,0.443,0.017,0.036,0.039,0.023,0.056,0.031,0.042,0.022,0.007,0.02,0.013,0.031,0.036,0.032,0.026,0.038,0.131,0.087,0.109,0.176,0.23,0.035,0.23,0.21,0.212,0.232,0.326,0.1,0.352,0.479,0.45,0.273,0.012];
      const cv = document.getElementById("lat-cv");
      const ctx = cv.getContext("2d");
      const X0 = 120, X1 = 1800, Y0 = 200, Y1 = 860;
      const N = SHARES.length, colW = (X1 - X0) / N, rows = Math.floor((Y1 - Y0) / colW);
      function hash(a, b) { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; h ^= h >>> 16; return ((h >>> 0) % 100000) / 100000; }
      const st = { p: 0 };
      function draw() {
        ctx.clearRect(0, 0, 1920, 1080);
        const shown = st.p * N;
        for (let c = 0; c < N; c++) {
          if (c >= shown) break;
          const fresh = shown - c < 1.5;
          for (let r = 0; r < rows; r++) {
            const x = X0 + c * colW, y = Y0 + r * colW;
            const lit = hash(c + 1, r + 7) < 0.015 + SHARES[c] * 1.9;
            if (lit) { ctx.fillStyle = fresh ? "#eceae3" : "#f2a65a"; ctx.fillRect(x + 3, y + 3, colW - 6, colW - 6); }
            else { ctx.fillStyle = "rgba(236,234,227,0.16)"; ctx.fillRect(x + colW / 2 - 2, y + colW / 2 - 2, 4, 4); }
          }
        }
        const n = Math.max(1, Math.min(N, Math.ceil(shown)));
        document.getElementById("lat-num").textContent = String(n).padStart(2, "0");
      }
      const tl = gsap.timeline({ paused: true, onUpdate: draw });
      tl.fromTo(["#lat-counter", "#lat-axis-l", "#lat-axis-r"], { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 0.05);

      draw();
      window.__timelines["lattice"] = tl;
    })();
