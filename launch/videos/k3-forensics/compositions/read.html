<template>
  <style>
    @font-face { font-family: "Geist"; src: url("assets/fonts/geist-latin.woff2") format("woff2"); font-weight: 100 900; }
    @font-face { font-family: "Geist Mono"; src: url("assets/fonts/geist-mono-latin.woff2") format("woff2"); font-weight: 100 900; }
    #root { position: absolute; inset: 0; background: #121614; color: #eceae3; font-family: "Geist", sans-serif; overflow: hidden; }
    #read-stage { position: absolute; inset: 0; }
    #read-cv { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #read-req { position: absolute; left: 152px; top: 800px; font: 500 44px/1.5 "Geist Mono", monospace; color: #8d968f; white-space: pre; }
    #read-req .hl { color: #f2a65a; }
    #read-lines { position: absolute; left: 120px; top: 330px; display: flex; flex-direction: column; gap: 10px; }
    .read-line { font-size: 170px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; }
    .read-w { display: inline-block; }
    .read-acc { color: #f2a65a; }
  </style>
  <div id="root" data-composition-id="read" data-width="1920" data-height="1080">
    <div id="read-stage">
      <canvas id="read-cv" width="1920" height="1080"></canvas>
      <div id="read-req"><span id="read-req-1"></span>
<span id="read-req-2" class="hl"></span></div>
    </div>
    <div id="read-lines">
      <div class="read-line" id="read-l1"><span class="read-w">We</span> <span class="read-w">didn't</span> <span class="read-w">run</span> <span class="read-w">it.</span></div>
      <div class="read-line" id="read-l2"><span class="read-w">We</span> <span class="read-w read-acc">read</span> <span class="read-w">it.</span></div>
    </div>
  </div>
  <script>
    (function () {
      const cv = document.getElementById("read-cv");
      const ctx = cv.getContext("2d");
      const CELL = 12, DOT = 8;
      const bayer = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
      const REQ1 = "GET model-00094-of-000096.safetensors";
      const REQ2 = "Range: bytes=2348810824-4697621063";
      const st = { m: 0, hl: 0, typed: 0 };
      const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      function dots(x, y, w, h, color, level) {
        ctx.fillStyle = color;
        const c0 = Math.floor(x / CELL), c1 = Math.ceil((x + w) / CELL);
        const r0 = Math.floor(y / CELL), r1 = Math.ceil((y + h) / CELL);
        for (let c = c0; c < c1; c++) for (let r = r0; r < r1; r++) {
          if (bayer[(r % 4) * 4 + (c % 4)] / 16 < level) ctx.fillRect(c * CELL, r * CELL, DOT, DOT);
        }
      }
      function draw() {
        ctx.clearRect(0, 0, 1920, 1080);
        const bw = 120, bh = 64, gap = 16;
        for (let i = 0; i < 96; i++) {
          // stagger each shard's travel slightly by index
          const local = Math.min(1, Math.max(0, (st.m * 1.25 - (i / 96) * 0.25)));
          const k = ease(local);
          const sx = 120 + (i * 1680) / 96, sy = 680, sw = 1680 / 96, sh = 120;
          const col = i % 12, row = Math.floor(i / 12);
          const tx = 152 + col * (bw + gap), ty = 120 + row * (bh + gap);
          const x = sx + (tx - sx) * k, y = sy + (ty - sy) * k, w = sw + (bw - sw) * k, h = sh + (bh - sh) * k;
          const isHit = i === 93;
          const color = isHit && st.hl > 0 ? "#f2a65a" : "#eceae3";
          const level = isHit ? 0.62 + 0.38 * st.hl : 0.62 - 0.3 * st.hl;
          dots(x, y, w, h, color, level);
        }
        const n = Math.round(st.typed * (REQ1.length + REQ2.length));
        document.getElementById("read-req-1").textContent = REQ1.slice(0, Math.min(n, REQ1.length));
        document.getElementById("read-req-2").textContent = REQ2.slice(0, Math.max(0, n - REQ1.length));
      }
      const tl = gsap.timeline({ paused: true, onUpdate: draw });
      tl.fromTo(st, { m: 0 }, { m: 1, duration: 0.85, ease: "none" }, 0);
      tl.fromTo(st, { hl: 0 }, { hl: 1, duration: 0.3, ease: "power2.out" }, 1.1);
      tl.fromTo(st, { typed: 0 }, { typed: 1, duration: 1.1, ease: "none" }, 1.5);
      tl.fromTo("#read-stage", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power3.in", immediateRender: false }, 4.1);
      tl.fromTo("#read-l1 .read-w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.07, ease: "power4.out" }, 4.3);
      tl.fromTo("#read-l2 .read-w", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.07, ease: "power4.out" }, 5.0);
      tl.fromTo("#read-lines", { opacity: 1 }, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in", immediateRender: false }, 6.35);
      draw();
      window.__timelines["read"] = tl;
    })();
  </script>
</template>
